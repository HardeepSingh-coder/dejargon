<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Cross/Heart Shield Glow -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" filter="url(#softShadow)" />

  <!-- Subtle Inner Shield / Care Circle -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.2" />

  <!-- Clinical Medical Cross with Rounded Corners -->
  <g fill="url(#crossGrad)">
    <rect x="52" y="32" width="16" height="56" rx="8" />
    <rect x="32" y="52" width="56" height="16" rx="8" />
  </g>

  <!-- ECG Pulse / Vital Signal Line Cutting Through Center -->
  <path d="M 28 60 L 45 60 L 52 44 L 60 76 L 68 50 L 75 60 L 92 60" 
        fill="none" 
        stroke="#0284c7" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Tiny Golden Translation Star / Accent representing understanding -->
  <circle cx="84" cy="36" r="5" fill="#facc15" />
  <circle cx="84" cy="36" r="2.5" fill="#ffffff" />
</svg>
